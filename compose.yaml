services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: farm_2569
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - farm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farm_2569"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/farm_2569?schema=farm_ledger
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/farm_2569?schema=farm_ledger
      SEED_EMAIL: ${SEED_EMAIL:-owner@farm.local}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  farm_db:
